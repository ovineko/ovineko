components:
  schemas:
    CreatePetRequest:
      properties:
        name:
          type: string
        tag:
          type: string
      required:
        - name
      type: object
    Pet:
      properties:
        id:
          type: string
        name:
          type: string
        tag:
          type: string
      required:
        - id
        - name
      type: object
info:
  title: Petstore Minimal
  version: "1.0.0"
openapi: "3.1.0"
paths:
  /pets:
    get:
      operationId: listPets
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            format: int32
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Pet"
                type: array
          description: A list of pets
      summary: List all pets
      tags:
        - pet
    post:
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
          description: Pet created
      summary: Create a pet
      tags:
        - pet
  /pets/{petId}:
    get:
      operationId: getPetById
      parameters:
        - in: path
          name: petId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
          description: A pet
        "404":
          description: Pet not found
      summary: Get a pet by ID
      tags:
        - pet
servers:
  - url: https://petstore.example.com/api/v1
tags:
  - description: Pet operations
    name: pet
