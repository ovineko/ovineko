components:
  schemas:
    CreatePetRequest:
      properties:
        name:
          type: string
      required:
        - name
      type: object
    Pet:
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
  securitySchemes:
    apiKey:
      in: header
      name: X-API-Key
      type: apiKey
    oauth2:
      flows:
        authorizationCode:
          authorizationUrl: https://example.com/oauth/authorize
          scopes:
            admin: Full admin access
            pets:read: Read access to pets
            pets:write: Write access to pets
          tokenUrl: https://example.com/oauth/token
      type: oauth2
info:
  title: Petstore OAuth
  version: "1.0.0"
openapi: "3.1.0"
paths:
  /admin/stats:
    get:
      operationId: getStats
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Stats
      security:
        - oauth2:
            - admin
      summary: Get admin stats
      tags:
        - admin
  /pets:
    get:
      operationId: listPets
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Pet"
                type: array
          description: A list of pets
      security:
        - oauth2:
            - pets:read
      summary: List all pets
      tags:
        - pet
    post:
      operationId: createPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePetRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
          description: Pet created
      security:
        - oauth2:
            - pets:read
            - pets:write
      summary: Create a pet
      tags:
        - pet
  /pets/{petId}:
    get:
      operationId: getPetById
      parameters:
        - in: path
          name: petId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
          description: A pet
      security:
        - oauth2:
            - pets:read
        - apiKey: []
      summary: Get a pet by ID
      tags:
        - pet
  /public/health:
    get:
      operationId: healthCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Health status
      summary: Health check (no auth)
      tags:
        - public
servers:
  - url: https://petstore.example.com/api/v1
tags:
  - description: Pet operations
    name: pet
  - description: Admin operations
    name: admin
  - description: Public endpoints
    name: public
